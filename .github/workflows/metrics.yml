# Builds the two profile cards from public + private data, using METRICS_TOKEN:
#   assets/stats.svg      years on GitHub, all-time contributions + commits, repos, app downloads
#   assets/languages.svg  most-used languages across your own repos
#   assets/years.svg      contributions for each year since joining
# Runs daily, on manual trigger, and when you push to main.
name: Metrics

on:
  schedule: [{ cron: "30 0 * * *" }]   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["assets/stats.svg", "assets/languages.svg", "assets/years.svg", "profile-3d-contrib/**"]

permissions:
  contents: write

# If several runs start close together (e.g. while uploading files), keep only the latest
concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build stats, languages and years cards
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/stats.mjs
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg assets/years.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update stats cards"
          # main may have moved since checkout (another commit landed): rebase, then push
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
