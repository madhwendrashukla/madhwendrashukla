# 1) stats:   builds assets/stats.svg (years on GitHub, all-time contributions + commits incl. private, repos)
# 2) metrics: builds metrics.svg (most-used languages incl. private repos + contribution calendar)
# Runs daily, on manual trigger, and when you push to main.
name: Metrics

on:
  schedule: [{ cron: "30 0 * * *" }]   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["assets/stats.svg", "metrics.svg"]

permissions:
  contents: write

# If several runs start close together (e.g. while uploading files), keep only the latest
concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build stats card
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/stats.mjs
      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update stats card"
          # main may have moved since checkout (another commit landed): rebase, then push
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

  metrics:
    needs: stats
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: madhwendrashukla
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Kolkata

          # Header/activity now live in assets/stats.svg, so only languages + calendar here
          base: ""

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, makefile, dockerfile, shell, batchfile

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
