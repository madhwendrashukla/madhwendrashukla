# Generates metrics.svg (account age, total commits, languages incl. private repos)
# and commits it to this repo. Runs daily, on every push, and on demand.
name: Metrics

on:
  schedule: [{ cron: "30 0 * * *" }]   # daily, 06:00 IST
  workflow_dispatch:
  push: { branches: ["main", "master"] }

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: madhwendrashukla
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Kolkata

          # Header: "Joined GitHub X years ago", total commits, PRs, issues, repos
          base: header, activity, community, repositories, metadata

          # Most-used languages, counting private repos too
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, makefile, dockerfile, shell, batchfile

          # Year-round contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
